[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.dependencies]
ukuk-core = { path = "crates/ukuk-core" }
ukuk-peru = { path = "crates/ukuk-peru" }
ukuk-forensics = { path = "crates/ukuk-forensics" }
ukuk-names = { path = "crates/ukuk-names" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
kamadak-exif = "0.6.1"
quick-xml = "0.42.0"
flate2 = "1.1.10"
memchr = "2.8.3"
regex = "1.13.1"
csv = "1.4.0"
strsim = "0.11.1"
rayon = "1.12.0"
md-5 = "0.11.0"
sha2 = "0.11.1"
aes = "0.9.3"
hex = "0.4.3"
base64 = "0.23.1"
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "net", "fs"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
http-body-util = "0.1.5"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
